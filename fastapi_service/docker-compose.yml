services:
  taxi-fastapi:
    build: .
    container_name: taxi-fastapi
    ports:
      - "8000:8080"
    environment:
      - MODEL_BASE_PATH=/app/models/taxi_trips_model
      - OTEL_SERVICE_NAME=taxi-fastapi
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4319
      - FEATURE_SERVICE_URL=http://host.docker.internal:8090/enrich
      - MODEL_URI=./model_artifact
      - MODEL_VERSION=v20260526